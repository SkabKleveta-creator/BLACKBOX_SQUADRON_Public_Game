<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLACKBOX responsive QA</title><style>body{margin:24px;background:#111923;color:#d7e8ef;font:14px monospace}nav{display:flex;gap:15px;margin-bottom:20px}button{padding:12px;background:#243e4b;color:#cef5ff;border:1px solid #52778a}iframe{border:1px solid #608293;display:block;background:#050b12}p{color:#9cb1bd;max-width:900px;line-height:1.6}</style></head><body><h1>BLACKBOX responsive layout checks</h1><p>Fixed-size frames exercise the actual game layout. Flight saves are shared with the game on this origin. This checks layout only; it does not emulate a physical touchscreen.</p><nav><button data-size="390,844">Phone portrait · 390 × 844</button><button data-size="375,667">Compact phone · 375 × 667</button><button data-size="844,390">Landscape · 844 × 390</button></nav><iframe id="preview" title="Responsive game preview" src="../index.html" width="390" height="844"></iframe><script>document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const [w,h]=b.dataset.size.split(',');const f=document.getElementById('preview');f.width=w;f.height=h}));</script></body></html>
